name: Actualizar bloqueo de dependencias

# El proyecto fija la versión exacta (gradle.lockfile) y la huella SHA-256
# (gradle/verification-metadata.xml) de cada dependencia. Cuando se añade o cambia una
# en gradle/libs.versions.toml, este flujo regenera ambos ficheros y los sube a la rama.
on:
  workflow_dispatch:
  push:
    paths:
      - gradle/libs.versions.toml
      - app/build.gradle.kts
      - settings.gradle.kts

permissions:
  contents: write

concurrency:
  group: dependencias-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bloqueo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21.0.11+10.0.LTS

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Regenerar bloqueos y huellas
        run: |
          ./gradlew --no-configuration-cache --write-locks --write-verification-metadata sha256 \
            :app:dependencies resolveIdeRuntimeClasspathCopyLocks

      - name: Subir los cambios a la rama
        run: |
          if git diff --quiet; then
            echo "Sin cambios en los bloqueos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gradle/verification-metadata.xml '*.lockfile'
          git commit -m "Actualiza el bloqueo y las huellas de las dependencias"
          git push origin "HEAD:${GITHUB_REF_NAME}"
