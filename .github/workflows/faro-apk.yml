name: Compilar APK de Faro

# Compila un APK optimizado (release, firmado con la clave de pruebas) en cada push y lo publica en la Release
# "prueba", que se sustituye en cada compilación. Enlace fijo de descarga:
# https://github.com/<usuario>/<repo>/releases/download/prueba/faro-prueba.apk
on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: faro-apk
  cancel-in-progress: true

env:
  SETUP_JAVA_VERSION: 21.0.11+10.0.LTS
  # Número de versión creciente: las actualizaciones OTA comparan este número.
  FARO_VERSION_CODE: ${{ github.run_number }}00
  FARO_VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  apk:
    name: APK de prueba
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Clave de firma de pruebas fija, para que cada APK nuevo se instale encima
      # del anterior sin desinstalar. Solo vale para pruebas, nunca para tiendas.
      - name: Usar la clave de pruebas
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Compilar (versión optimizada)
        env:
          FARO_RELEASE_SIGNING: debug
        run: ./gradlew :app:assembleRelease

      - name: Tests de Faro
        run: ./gradlew :app:testDebugUnitTest --tests 'com.bitchat.android.update.*' --tests 'com.bitchat.android.faro.*' --tests 'com.bitchat.android.mesh.PowerProfileResolverTest'

      - name: Preparar el APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*universal*.apk | head -n1)
          cp "$apk" faro-prueba.apk
          # Versión ligera solo para móviles arm64 (casi todos los actuales)
          arm=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -n1)
          cp "$arm" faro-prueba-arm64.apk
          ls -la faro-prueba*.apk

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faro-apk-prueba
          path: faro-prueba*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar en la Release "prueba"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="Versión de prueba compilada desde la rama ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}, el $(date -u '+%d/%m/%Y a las %H:%M') UTC.

          Descarga **faro-prueba-arm64.apk** (más ligera, para casi todos los móviles actuales) o, si no se instala, **faro-prueba.apk** (universal), e instálala en el móvil (acepta instalar apps de origen desconocido). Se instala encima de la versión anterior sin perder datos."
          gh release delete prueba --cleanup-tag --yes || true
          gh release create prueba faro-prueba-arm64.apk faro-prueba.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Faro — versión de prueba" \
            --notes "$notas"

      # Publica la versión numerada de la que la app descarga las actualizaciones OTA
      # (releases/latest/download/version.json). Va en este mismo repositorio público,
      # así que basta con el permiso de GitHub Actions; no hace falta ningún token.
      # La Release "prueba" es preliminar, así que no cuenta como "latest".
      - name: Publicar versión para las actualizaciones OTA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${FARO_VERSION_NAME}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          cp faro-prueba.apk faro.apk
          cp faro-prueba-arm64.apk faro-arm64.apk
          cp "$(ls app/build/outputs/apk/release/*armeabi-v7a*.apk | head -n1)" faro-armv7.apk
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s","sha256":"%s","apks":{"arm64-v8a":{"url":"%s","sha256":"%s"},"armeabi-v7a":{"url":"%s","sha256":"%s"}}}\n' \
            "$FARO_VERSION_CODE" "$FARO_VERSION_NAME" \
            "$base/faro.apk" "$(sha faro.apk)" \
            "$base/faro-arm64.apk" "$(sha faro-arm64.apk)" \
            "$base/faro-armv7.apk" "$(sha faro-armv7.apk)" > version.json
          cat version.json
          gh release create "$tag" faro.apk faro-arm64.apk faro-armv7.apk version.json \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Faro ${FARO_VERSION_NAME}" \
            --notes "Versión ${FARO_VERSION_NAME} (commit ${GITHUB_SHA::7}). Descarga **faro.apk** e instálalo; las siguientes versiones llegarán solas por la app."
          # Conserva solo las 5 versiones numeradas más recientes para no acumular APKs.
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == false) | .tagName' \
            | grep '^v0\.' | tail -n +6 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
